name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major
permissions:
  contents: write
concurrency:
  group: power-agent-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Install build dependency
        shell: pwsh
        run: Install-Module PSScriptBuilder -RequiredVersion 1.2.0 -Scope CurrentUser -Force
      - name: Increment version
        id: version
        shell: pwsh
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          $version = ./scripts/Bump-Version.ps1 -Bump $env:BUMP
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Bundle with PSScriptBuilder
        shell: pwsh
        run: ./scripts/Build.ps1
      - name: Verify all tests and standalone bundle
        shell: pwsh
        run: ./scripts/Test.ps1
      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash ./dist/Power-Agent.ps1 -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  Power-Agent.ps1" | Set-Content ./dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Commit, tag and publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PSGoAgent.psd1
          git commit -m "chore: release v${VERSION}"
          git tag "v${VERSION}"
          git push --atomic origin HEAD:main "v${VERSION}"
          gh release create "v${VERSION}" dist/Power-Agent.ps1 dist/SHA256SUMS.txt --title "Power Agent v${VERSION}" --generate-notes --verify-tag --latest
